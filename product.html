<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DanShop - تفاصيل المنتج</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <div class="container navbar">
            <a href="index.html" class="logo"><i class="fa-solid fa-bolt" style="color:var(--accent)"></i> DanShop</a>
            <nav class="nav-links" id="navLinks">
                <a href="index.html" data-i18n="home">الرئيسية</a>
                <a href="products.html" data-i18n="products">المنتجات</a>
                <a href="about.html" data-i18n="about">من نحن</a>
                <a href="contact.html" data-i18n="contact">اتصل بنا</a>
            </nav>
            <div class="nav-actions">
                <div class="lang-switch">
                    <button onclick="toggleLang('ar')" class="active" id="btn-ar">ع</button>
                    <button onclick="toggleLang('en')" id="btn-en">EN</button>
                </div>
                <button class="menu-toggle" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>
    </header>

    <main class="site-main container" style="padding-top:40px;">
        <div class="product-detail" id="product-detail-container"></div>
    </main>

    <script src="data.js"></script>
    <script src="main.js"></script>
</body>

</html>
