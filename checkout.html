<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DanShop - إتمام الطلب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <div class="container navbar">
            <a href="index.html" class="logo"><i class="fa-solid fa-bolt" style="color:var(--accent)"></i> DanShop</a>
        </div>
    </header>
    <main class="site-main container" style="padding-top:40px;">
        <div class="card-form">
            <h2 style="text-align:center; margin-bottom:20px; color:var(--primary);" data-i18n="checkout">إتمام الطلب</h2>
            <form onsubmit="processCheckout(event)">
                <div class="form-group"><label data-i18n="name">الاسم</label><input type="text" required></div>
                <div class="form-group"><label data-i18n="phone">رقم الهاتف</label><input type="tel" required></div>
                <div class="form-group"><label data-i18n="address">العنوان</label><textarea required rows="3"></textarea></div>
                <button type="submit" class="btn btn-accent btn-block" data-i18n="confirm_order">تأكيد الطلب</button>
            </form>
        </div>
    </main>
    <script src="data.js"></script>
    <script src="main.js"></script>
</body>

</html>
